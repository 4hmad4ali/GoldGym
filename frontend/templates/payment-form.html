<!--    PAYMENT FORM    -->
<div id="page-payment-form" class="page-section finance-form-page">
    <div class="finance-form-page__header"><div><button class="finance-form-page__back" type="button" onclick="navigate('payments')"><i class="fas fa-arrow-right"></i> بازگشت به پرداخت‌ها</button><span class="finance-form-page__kicker" id="paymentFormKicker">PAYMENT REGISTER</span><h1 class="finance-form-page__title" id="paymentFormTitle">ثبت پرداخت جدید</h1><p class="finance-form-page__subtitle" id="paymentFormSubtitle">دریافتی عضو را ثبت کنید تا در گزارش‌های مالی باشگاه نمایش داده شود.</p></div></div>
    <form id="paymentPageForm" class="finance-form" onsubmit="event.preventDefault(); savePayment();"><input type="hidden" id="paymentEditId">
        <section class="finance-form-card"><div class="finance-form-card__heading"><span><i class="fas fa-wallet"></i></span><div><h2>اطلاعات پرداخت</h2><p>پرداخت عضو ثبت‌شده یا مراجعه‌کننده روزانه را وارد کنید.</p></div></div><div class="finance-form-grid form-gold"><div><label class="form-label" for="pPaymentType">نوع پرداخت <em>*</em></label><select class="form-control-gold" id="pPaymentType" onchange="togglePaymentPersonFields()"><option value="member">عضو ثبت‌شده</option><option value="daily">عضو روزانه / مراجعه‌کننده</option></select></div><div class="finance-form-grid__wide" id="pMemberField"><label class="form-label" for="pMember">عضو <em>*</em></label><select class="form-control-gold" id="pMember" required></select></div><div class="finance-form-grid__wide" id="pDailyVisitorField" hidden><label class="form-label" for="pDailyVisitor">نام مراجعه‌کننده (اختیاری)</label><input type="text" class="form-control-gold" id="pDailyVisitor" placeholder="مثلاً مراجعه‌کننده روزانه"></div><div><label class="form-label" for="pAmount">مبلغ (AFN) <em>*</em></label><input type="number" class="form-control-gold" id="pAmount" min="1" required dir="ltr"></div><div><label class="form-label" for="pMethod">روش پرداخت</label><select class="form-control-gold" id="pMethod"><option value="نقدی">نقدی</option><option value="کارت بانکی">کارت بانکی</option><option value="انتقال بانکی">انتقال بانکی</option></select></div><div><label class="form-label" for="pDate">تاریخ پرداخت</label><input type="date" class="form-control-gold" id="pDate"></div><div class="finance-form-grid__wide"><label class="form-label" for="pNotes">یادداشت</label><textarea class="form-control-gold" id="pNotes" rows="3" placeholder="توضیحات تکمیلی درباره این پرداخت..."></textarea></div></div></section>
        <div class="finance-form__actions"><button class="finance-form-page__cancel" type="button" onclick="navigate('payments')">انصراف</button><button class="btn-gold finance-form-page__save" type="submit"><i class="fas fa-save"></i> ذخیره پرداخت</button></div>
    </form>
</div>
