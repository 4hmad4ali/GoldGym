<!-- ==================== PAYMENTS ==================== -->
<div id="page-payments" class="page-section payments-page">
    <header class="payments-page__header">
        <div><div class="payments-page__kicker">PAYMENT REGISTER</div><h1 class="payments-page__title"><i class="fas fa-wallet"></i>مدیریت پرداخت‌ها</h1><p class="payments-page__subtitle">دریافتی‌های باشگاه را ثبت، پیگیری و به‌سادگی مرور کنید.</p></div>
        <button class="payments-page__add" type="button" onclick="openPaymentModal()"><i class="fas fa-plus"></i>ثبت پرداخت</button>
    </header>
    <section class="payments-overview" aria-label="خلاصه درآمد">
        <article class="payments-metric"><span class="payments-metric__icon today"><i class="fas fa-calendar-day"></i></span><div><strong id="paymentStatDaily">0</strong><span>دریافتی امروز</span></div><em>AFN</em></article>
        <article class="payments-metric"><span class="payments-metric__icon monthly"><i class="fas fa-calendar-week"></i></span><div><strong id="paymentStatMonthly">0</strong><span>دریافتی این ماه</span></div><em>AFN</em></article>
        <article class="payments-metric"><span class="payments-metric__icon yearly"><i class="fas fa-chart-line"></i></span><div><strong id="paymentStatYearly">0</strong><span>دریافتی امسال</span></div><em>AFN</em></article>
        <article class="payments-metric"><span class="payments-metric__icon total"><i class="fas fa-coins"></i></span><div><strong id="paymentStatTotal">0</strong><span>کل دریافتی</span></div><em>AFN</em></article>
    </section>
    <section class="payments-directory">
        <div class="payments-directory__toolbar"><div><h2>تراکنش‌های ثبت‌شده</h2><p><span id="paymentsResultCount">0</span> تراکنش در این نمایش</p></div><div class="payments-filters"><label class="payments-search" for="paymentSearch"><i class="fas fa-magnifying-glass"></i><input type="search" class="form-control-gold" id="paymentSearch" placeholder="جستجو با نام، کد یا رسید..." oninput="filterPayments()"></label><button class="payments-clear-filter" type="button" onclick="clearPaymentFilter()" title="پاک کردن جستجو"><i class="fas fa-filter-circle-xmark"></i><span>پاک کردن</span></button></div></div>
        <div class="table-responsive payments-table-wrap"><table class="table-gold payments-table"><thead><tr><th>رسید</th><th>عضو</th><th>مبلغ پرداختی</th><th>روش پرداخت</th><th>تاریخ ثبت</th><th class="text-center">عملیات</th></tr></thead><tbody id="paymentsBody"></tbody></table></div>
    </section>
</div>
