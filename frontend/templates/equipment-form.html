<!-- ==================== EQUIPMENT FORM ==================== -->
<div id="page-equipment-form" class="page-section finance-form-page">
    <div class="finance-form-page__header"><div><button class="finance-form-page__back" type="button" onclick="navigate('equipment')"><i class="fas fa-arrow-right"></i> بازگشت به تجهیزات</button><span class="finance-form-page__kicker" id="equipmentFormKicker">EQUIPMENT INVENTORY</span><h1 class="finance-form-page__title" id="equipmentFormTitle">افزودن تجهیزات جدید</h1><p class="finance-form-page__subtitle" id="equipmentFormSubtitle">مشخصات و وضعیت عملیاتی تجهیزات باشگاه را ثبت کنید.</p></div></div>
    <form id="equipmentPageForm" class="finance-form" onsubmit="event.preventDefault(); saveEquipment();"><input type="hidden" id="equipmentEditId">
        <section class="finance-form-card"><div class="finance-form-card__heading"><span><i class="fas fa-dumbbell"></i></span><div><h2>اطلاعات تجهیزات</h2><p>برای مدیریت بهتر موجودی، جزئیات این مورد را وارد کنید.</p></div></div><div class="finance-form-grid form-gold"><div class="finance-form-grid__wide"><label class="form-label" for="eName">نام تجهیزات <em>*</em></label><input type="text" class="form-control-gold" id="eName" required></div><div><label class="form-label" for="eCategory">دسته‌بندی</label><select class="form-control-gold" id="eCategory"><option value="کاردیو">کاردیو</option><option value="وزنه">وزنه</option><option value="دستگاه">دستگاه</option><option value="بدن‌وزن">بدن‌وزن</option><option value="لوازم جانبی">لوازم جانبی</option><option value="ریکاوری">ریکاوری</option><option value="رخت‌کن">رخت‌کن</option><option value="سایر">سایر</option></select></div><div><label class="form-label" for="eQuantity">تعداد</label><input type="number" class="form-control-gold" id="eQuantity" value="1" min="1" dir="ltr"></div><div><label class="form-label" for="eStatus">وضعیت</label><select class="form-control-gold" id="eStatus"><option value="Active">فعال</option><option value="Broken">خراب</option><option value="Inactive">غیرفعال</option></select></div><div><label class="form-label" for="eLocation">محل استقرار</label><input type="text" class="form-control-gold" id="eLocation" placeholder="مثلاً سالن اصلی"></div><div class="finance-form-grid__wide"><label class="form-label" for="eNotes">یادداشت</label><textarea class="form-control-gold" id="eNotes" rows="3" placeholder="توضیحات تکمیلی، وضعیت تعمیر یا نکات نگهداری..."></textarea></div></div></section>
        <div class="finance-form__actions"><button class="finance-form-page__cancel" type="button" onclick="navigate('equipment')">انصراف</button><button class="btn-gold finance-form-page__save" type="submit"><i class="fas fa-save"></i> ذخیره تجهیزات</button></div>
    </form>
</div>
